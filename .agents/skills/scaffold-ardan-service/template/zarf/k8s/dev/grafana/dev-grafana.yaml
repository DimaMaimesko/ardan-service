apiVersion: v1
kind: Namespace
metadata:
  name: tmplsvc-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-conf-datasources
  namespace: tmplsvc-system
data:
  sources.yaml: |
    apiVersion: 1

    deleteDatasources:
      - name: Tempo
        orgId: 1

    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.tmplsvc-system.svc:3200
        access: proxy
        isDefault: true
        jsonData:
          nodeGraph:
            enabled: true
          search:
            hide: false
          spanBar:
            type: 'Tag'
            tag: 'http.path'
        version: 1
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-conf-dashboards
  namespace: tmplsvc-system
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: dashboards
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/dashboards
          foldersFromFilesStructure: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: tmplsvc-system
data:
  tmplsvc.json: |
    {
      "description": "tmplsvc traces",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": { "cellHeight": "sm", "showHeader": true },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "limit": 50,
              "queryType": "nativeSearch",
              "refId": "A",
              "serviceName": "tmplsvc"
            }
          ],
          "title": "tmplsvc - Traces",
          "type": "table"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": [],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "tmplsvc",
      "uid": "tmplsvc-traces",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tmplsvc-system
  labels:
    app: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  template:
    metadata:
      namespace: tmplsvc-system
      labels:
        app: grafana
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_SERVER_HTTP_PORT
              value: "3100"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/etc/dashboards/tmplsvc.json"
          ports:
            - containerPort: 3100
              name: http-grafana
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: http-grafana
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http-grafana
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 3400m
          volumeMounts:
            - name: config-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: config-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/dashboards
      volumes:
        - name: config-datasources
          configMap:
            name: grafana-conf-datasources
        - name: config-dashboards
          configMap:
            name: grafana-conf-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: tmplsvc-system
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http-grafana
      port: 3100
      targetPort: http-grafana
