# Development overrides for the Kind cluster.
# Use with: helm upgrade --install -f values-dev.yaml

image:
  repository: localhost/tmplsvc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate

resources:
  requests:
    cpu: "250m"
    memory: "100Mi"
  limits:
    cpu: "250m"
    memory: "100Mi"

hostNetwork: true # Expose ports on the Kind node so extraPortMappings reach them.

initContainer:
  enabled: true
  command: ["./admin", "migrate-seed"]

database:
  disableTls: "true"

tracing:
  host: "tempo:4317"
  probability: "1.0"

secret:
  create: true
  password: "postgres"
