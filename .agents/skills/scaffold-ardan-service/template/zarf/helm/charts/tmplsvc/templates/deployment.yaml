apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmplsvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tmplsvc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tmplsvc.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        {{- include "tmplsvc.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      {{- if .Values.initContainer.enabled }}
      initContainers:
        - name: init-migrate-seed
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{- toYaml .Values.initContainer.command | nindent 12 }}
          env:
            {{- include "tmplsvc.dbEnvVars" . | nindent 12 }}
      {{- end }}

      containers:
        - name: tmplsvc
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http }}
            - name: debug
              containerPort: {{ .Values.service.ports.debug }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keys
              mountPath: /service/zarf/keys
              readOnly: true
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: GOGC
              value: {{ .Values.env.GOGC | quote }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: TMPLSVC_TEMPO_HOST
              valueFrom:
                configMapKeyRef:
                  name: tmplsvc-config
                  key: tracing_host
            - name: TMPLSVC_TEMPO_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: tmplsvc-config
                  key: tracing_probability
            - name: TMPLSVC_AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tmplsvc-config
                  key: auth_issuer
            - name: TMPLSVC_AUTH_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: tmplsvc-secret
                  key: auth_keys_json
                  optional: true
            {{- include "tmplsvc.dbEnvVars" . | nindent 12 }}
            {{- include "tmplsvc.k8sEnvVars" . | nindent 12 }}
      volumes:
        - name: keys
          secret:
            secretName: {{ .Values.auth.keys.secretName }}
            optional: true
