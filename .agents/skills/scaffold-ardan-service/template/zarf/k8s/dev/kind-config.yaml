kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # tmplsvc API
      - containerPort: 3000
        hostPort: 3000
      # tmplsvc debug (pprof, expvar, statsviz)
      - containerPort: 3010
        hostPort: 3010
      # Grafana
      - containerPort: 3100
        hostPort: 3100
      # Postgres
      - containerPort: 5432
        hostPort: 5432
